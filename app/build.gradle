plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('AMC_KEYSTORE_PATH')
def storePasswordValue = System.getenv('AMC_STORE_PASSWORD')
def keyAliasValue = System.getenv('AMC_KEY_ALIAS')
def keyPasswordValue = System.getenv('AMC_KEY_PASSWORD')

android {
    namespace 'com.amc.construcciones'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amc.construcciones'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
        ['AMC_SERVER_URL','AMC_FIREBASE_APP_ID','AMC_FIREBASE_API_KEY','AMC_FIREBASE_SENDER_ID','AMC_FIREBASE_PROJECT_ID'].each { key -> buildConfigField 'String', key, groovy.json.JsonOutput.toJson(System.getenv(key) ?: '') }
        buildConfigField 'boolean', 'AMC_OWNER_APP', 'false'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.1' }
