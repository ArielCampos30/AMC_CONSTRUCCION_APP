name: AMC Media Access Refactor Check
on:
  push:
    branches: [refactor-media-access-staging]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: web-amc
        run: |
          npm ci --ignore-scripts
          npm test
