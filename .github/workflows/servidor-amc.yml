name: Servidor AMC - SQLite y PostgreSQL
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: amc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web-amc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Auditoría de dependencias
        run: npm audit --omit=dev
      - name: Registrar versiones verificadas
        if: always()
        run: node -e "console.log('AMC_LOCK_BEGIN'); console.log(require('fs').readFileSync('package-lock.json','utf8')); console.log('AMC_LOCK_END');"
      - name: Pruebas locales SQLite
        run: npm test
      - name: Pruebas PostgreSQL reales
        env:
          NODE_ENV: test
          AMC_TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/amc_ci
        run: npm test
