name: APK AMC unificada de prueba
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMC_SERVER_URL: ${{ vars.AMC_SERVER_URL }}
      AMC_FIREBASE_APP_ID: ${{ secrets.AMC_FIREBASE_APP_ID }}
      AMC_FIREBASE_API_KEY: ${{ secrets.AMC_FIREBASE_API_KEY }}
      AMC_FIREBASE_SENDER_ID: ${{ secrets.AMC_FIREBASE_SENDER_ID }}
      AMC_FIREBASE_PROJECT_ID: ${{ secrets.AMC_FIREBASE_PROJECT_ID }}
      AMC_KEYSTORE_BASE64: ${{ secrets.AMC_KEYSTORE_BASE64 }}
      AMC_STORE_PASSWORD: ${{ secrets.AMC_STORE_PASSWORD }}
      AMC_KEY_ALIAS: ${{ secrets.AMC_KEY_ALIAS }}
      AMC_KEY_PASSWORD: ${{ secrets.AMC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Instalar componentes SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK firmada o de prueba
        run: |
          if [ -n "$AMC_KEYSTORE_BASE64" ] && [ -n "$AMC_STORE_PASSWORD" ] && [ -n "$AMC_KEY_ALIAS" ] && [ -n "$AMC_KEY_PASSWORD" ]; then
            printf '%s' "$AMC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amc-release.jks"
            export AMC_KEYSTORE_PATH="$RUNNER_TEMP/amc-release.jks"
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk AMC-prueba.apk
            echo 'APK release firmada con la identidad estable configurada en GitHub Secrets.' > FIRMA-APK.txt
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk AMC-prueba.apk
            echo 'APK debug: configurá AMC_KEYSTORE_BASE64, AMC_STORE_PASSWORD, AMC_KEY_ALIAS y AMC_KEY_PASSWORD para actualizaciones estables.' > FIRMA-APK.txt
          fi
      - name: Preparar archivo
        run: |
          sha256sum AMC-prueba.apk > AMC-prueba.sha256
          if [ -z "$AMC_SERVER_URL" ]; then
            echo 'APK compilada sin servidor: muestra la pantalla de preparacion; no permite operar con clientes hasta configurar HTTPS.' > ESTADO-APK.txt
          else
            echo 'APK de prueba conectada al servidor configurado. Validar en Android antes de distribuir.' > ESTADO-APK.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AMC-APK-prueba
          path: |
            AMC-prueba.apk
            AMC-prueba.sha256
            ESTADO-APK.txt
            FIRMA-APK.txt
          retention-days: 14
