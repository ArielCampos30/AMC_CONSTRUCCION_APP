name: AMC Producción - Salud
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-smoke.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Salud de servidor y base
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 25             -D /tmp/health-headers.txt             https://amc-o0xb.onrender.com/healthz             -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"database":"available"' /tmp/health.json
          grep -qi '^x-request-id:' /tmp/health-headers.txt
          cat /tmp/health.json
      - name: Carga pública limpia
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 25             https://amc-o0xb.onrender.com/             -o /tmp/index.html
          grep -q 'id="boot-loader"' /tmp/index.html
          ! grep -q 'Cargando tus espacios' /tmp/index.html
      - name: Versión pública
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 25             https://amc-o0xb.onrender.com/api/config             -o /tmp/config.json
          grep -q '"version":"' /tmp/config.json
          cat /tmp/config.json
