name: AMC Refactor PDF Bootstrap
on:
  push:
    branches: [refactor-quote-pdf-actions-staging]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: refactor-quote-pdf-actions-staging
      - name: Extraer acciones PDF de presupuestos
        shell: bash
        run: |
          cat > web-amc/public/quote-pdf-actions.js <<'EOF'
          function pdfFileName(q){const base=String(q?.number||'Presupuesto-AMC').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'');return (base||'Presupuesto-AMC')+'.pdf';}
          async function pdfBlob(q){if(!q?.pdf)throw Error('Este presupuesto todavía no tiene PDF.');const response=await fetch(q.pdf,{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw Error('No pudimos abrir el PDF.');const blob=await response.blob();if(blob.type&&blob.type!=='application/pdf')throw Error('El archivo recibido no es un PDF válido.');return blob.type==='application/pdf'?blob:new Blob([blob],{type:'application/pdf'});}
          async function blobBase64(blob){const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary);}
          export async function downloadQuotePdf(q){window.AMCBusy?.start();try{const blob=await pdfBlob(q),name=pdfFileName(q);if(window.AMCNative?.savePdf){window.AMCNative.savePdf(await blobBase64(blob),name,false);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}finally{window.AMCBusy?.stop();}}
          export async function shareQuotePdf(q){window.AMCBusy?.start();try{const blob=await pdfBlob(q),name=pdfFileName(q);if(window.AMCNative?.savePdf){window.AMCNative.savePdf(await blobBase64(blob),name,true);return;}const file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:'Presupuesto AMC',text:q?.number||'Presupuesto AMC',files:[file]});return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);await window.AMCConfirm('Tu navegador no permite compartir archivos PDF directamente. AMC descargó el PDF para que puedas adjuntarlo desde WhatsApp u otra aplicación.',{title:'PDF descargado',confirmLabel:'Entendido',singleAction:true});}finally{window.AMCBusy?.stop();}}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          app=Path('web-amc/public/app.js')
          text=app.read_text()
          anchor="import {createAccountUI} from './account-ui.js';\n"
          imp="import {downloadQuotePdf,shareQuotePdf} from './quote-pdf-actions.js';\n"
          if imp not in text:
              if anchor not in text: raise SystemExit('No se encontró el ancla de imports de app.js')
              text=text.replace(anchor,anchor+imp,1)
          start=text.find('function pdfFileName(q){')
          end=text.find('const shownLiveNotices=new Set();',start)
          if start < 0 or end < 0: raise SystemExit('No se encontró el bloque PDF esperado en app.js')
          text=text[:start]+text[end:]
          app.write_text(text)

          test=Path('web-amc/tests/admin-ui.test.mjs')
          t=test.read_text()
          old="""test('PDF sharing sends a real PDF file instead of a raw media URL',async()=>{\n  const app=await readFile(new URL('../public/app.js',import.meta.url),'utf8');\n  assert.match(app,/function pdfFileName\\(q\\)/);\n  assert.match(app,/async function pdfBlob\\(q\\)/);\n  assert.match(app,/async function downloadQuotePdf\\(q\\)/);\n  assert.match(app,/async function shareQuotePdf\\(q\\)/);\n  assert.match(app,/new File\\(\\[blob\\],name,\\{type:'application\\/pdf'\\}\\)/);\n  assert.match(app,/navigator\\.canShare\\?\\.\\(\\{files:\\[file\\]\\}\\)/);\n  assert.match(app,/navigator\\.share\\(\\{title:'Presupuesto AMC',text:q\\?\\.number\\|\\|'Presupuesto AMC',files:\\[file\\]\\}\\)/);\n  assert.match(app,/window\\.AMCNative\\?\\.savePdf/);\n  assert.match(app,/data-action=\"download-pdf-admin\"/);\n  assert.match(app,/data-action=\"download-quote-pdf\"/);\n  assert.doesNotMatch(app,/navigator\\.share\\(\\{title:'Presupuesto AMC',url/);\n  assert.doesNotMatch(app,/Enlace al PDF copiado/);\n});"""
          new="""test('PDF sharing sends a real PDF file instead of a raw media URL',async()=>{\n  const [app,pdf]=await Promise.all([\n    readFile(new URL('../public/app.js',import.meta.url),'utf8'),\n    readFile(new URL('../public/quote-pdf-actions.js',import.meta.url),'utf8')\n  ]);\n  assert.match(app,/from '.\\/quote-pdf-actions\\.js'/);\n  assert.match(pdf,/function pdfFileName\\(q\\)/);\n  assert.match(pdf,/async function pdfBlob\\(q\\)/);\n  assert.match(pdf,/export async function downloadQuotePdf\\(q\\)/);\n  assert.match(pdf,/export async function shareQuotePdf\\(q\\)/);\n  assert.match(pdf,/new File\\(\\[blob\\],name,\\{type:'application\\/pdf'\\}\\)/);\n  assert.match(pdf,/navigator\\.canShare\\?\\.\\(\\{files:\\[file\\]\\}\\)/);\n  assert.match(pdf,/navigator\\.share\\(\\{title:'Presupuesto AMC',text:q\\?\\.number\\|\\|'Presupuesto AMC',files:\\[file\\]\\}\\)/);\n  assert.match(pdf,/window\\.AMCNative\\?\\.savePdf/);\n  assert.match(app,/data-action=\"download-pdf-admin\"/);\n  assert.match(app,/data-action=\"download-quote-pdf\"/);\n  assert.doesNotMatch(pdf,/navigator\\.share\\(\\{title:'Presupuesto AMC',url/);\n  assert.doesNotMatch(pdf,/Enlace al PDF copiado/);\n  assert.doesNotMatch(app,/function pdfFileName\\(q\\)/);\n});"""
          if old not in t: raise SystemExit('No se encontró el test PDF esperado')
          test.write_text(t.replace(old,new,1))
          PY
      - name: Comprobar pruebas locales
        working-directory: web-amc
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Guardar refactor y retirar bootstrap
        run: |
          rm .github/workflows/refactor-quote-pdf-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-amc/public/app.js web-amc/public/quote-pdf-actions.js web-amc/tests/admin-ui.test.mjs .github/workflows/refactor-quote-pdf-bootstrap.yml
          git commit -m 'Separar acciones PDF de presupuestos'
          git push origin HEAD:refactor-quote-pdf-actions-staging
