name: Refactor Auth Core Once
on: push
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-auth-core-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar refactor
        run: python3 scripts/refactor-auth-core.py
      - name: Instalar dependencias
        working-directory: web-amc
        run: npm ci --ignore-scripts
      - name: Ejecutar pruebas
        working-directory: web-amc
        run: npm test
      - name: Guardar cambio si corresponde
        run: |
          if git diff --quiet -- web-amc/server.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-amc/server.mjs
          git commit -m "Usar núcleo de autenticación desde server"
          git push origin HEAD:refactor-auth-core-staging
