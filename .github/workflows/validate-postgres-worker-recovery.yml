name: Validar recuperación del worker PostgreSQL
on:
  push:
    branches: [postgres-worker-recovery-staging]
permissions:
  contents: read
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: amc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web-amc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Auditoría de dependencias
        run: npm audit --omit=dev
      - name: Pruebas locales SQLite
        run: npm test
      - name: Pruebas PostgreSQL reales
        env:
          NODE_ENV: test
          AMC_TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/amc_ci
        run: npm test
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web-amc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-chromedriver: true
      - name: Iniciar AMC de prueba
        run: |
          nohup node server.mjs --demo > /tmp/amc-browser-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4180/healthz >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/amc-browser-server.log
          exit 1
      - name: Iniciar ChromeDriver
        run: |
          nohup "${{ steps.chrome.outputs.chromedriver-path }}" --port=9515 > /tmp/amc-chromedriver.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:9515/status >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/amc-chromedriver.log
          exit 1
      - name: Flujo real y accesibilidad básica
        env:
          AMC_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tests/browser-smoke.py
      - name: Ciclo completo Cliente Admin Empleado
        env:
          AMC_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tests/browser-lifecycle-runner.py
      - name: Mostrar logs si falla
        if: failure()
        run: |
          cat /tmp/amc-browser-server.log || true
          cat /tmp/amc-chromedriver.log || true
