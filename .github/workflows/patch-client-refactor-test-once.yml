name: Patch Client Refactor Test Once
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-client-requests-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actualizar prueba estructural
        run: python3 scripts/patch-client-refactor-test.py
      - name: Instalar dependencias
        working-directory: web-amc
        run: npm ci --ignore-scripts
      - name: Ejecutar pruebas
        working-directory: web-amc
        run: npm test
      - name: Guardar prueba actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-amc/tests/admin-ui.test.mjs
          git commit -m "Actualizar contrato estructural de clientes"
          git push origin HEAD:refactor-client-requests-staging
