name: Refactor Community Router Once
on:
  push:
    branches: [refactor-final-router-community-staging]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-final-router-community-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar extracción
        run: python3 scripts/refactor-community-router.py
      - name: Instalar dependencias
        working-directory: web-amc
        run: npm ci --ignore-scripts
      - name: Ejecutar pruebas
        working-directory: web-amc
        run: npm test
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-amc/server.mjs
          git commit -m "Delegar rutas de comunidad"
          git push origin HEAD:refactor-final-router-community-staging
