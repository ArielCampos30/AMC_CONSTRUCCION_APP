name: AMC Staging - Publicado
on:
  push:
    branches: [staging]
    paths:
      - 'web-amc/**'
      - '.github/workflows/staging-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Esperar el commit nuevo en Render
        run: |
          expected="${GITHUB_SHA::7}"
          for i in {1..40}; do
            body="$(curl -fsS --max-time 20 https://amc-staging.onrender.com/api/config || true)"
            version="$(printf '%s' "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
            echo "esperado=$expected publicado=$version"
            [ "$version" = "$expected" ] && exit 0
            sleep 10
          done
          echo "Staging no publicó el commit esperado."
          exit 1
      - name: Salud y carga inicial
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 25             -D /tmp/headers.txt https://amc-staging.onrender.com/healthz -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"database":"available"' /tmp/health.json
          grep -qi '^x-request-id:' /tmp/headers.txt
          curl -fsS --retry 3 --retry-all-errors --max-time 25             https://amc-staging.onrender.com/ -o /tmp/index.html
          grep -q 'id="boot-loader"' /tmp/index.html
          ! grep -q 'Cargando tus espacios' /tmp/index.html
