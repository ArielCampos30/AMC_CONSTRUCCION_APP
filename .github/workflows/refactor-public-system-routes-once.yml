name: Refactor Public System Routes Once
on:
  push:
    branches:
      - refactor-final-router-public-system-staging
    paths:
      - scripts/refactor-public-system-routes.py
      - .github/workflows/refactor-public-system-routes-once.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar extracción
        run: python scripts/refactor-public-system-routes.py
      - name: Instalar dependencias
        working-directory: web-amc
        run: npm ci --ignore-scripts
      - name: Ejecutar pruebas
        working-directory: web-amc
        run: npm test
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-amc/server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Delegar salud y configuración pública"
          git push
