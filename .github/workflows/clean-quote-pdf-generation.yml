name: AMC Clean PDF Generation Diff
on:
  push:
    branches: [refactor-quote-pdf-generation-staging]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: refactor-quote-pdf-generation-staging
          fetch-depth: 0
      - name: Limpiar refactor
        run: python3 .github/scripts/clean_quote_pdf_generation.py
      - name: Probar AMC
        working-directory: web-amc
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Guardar limpieza
        run: |
          git rm .github/workflows/clean-quote-pdf-generation.yml .github/scripts/clean_quote_pdf_generation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-amc/server.mjs web-amc/public/presupuestos-bridge.js web-amc/public/quote-pdf-generation.js web-amc/tests/admin-ui.test.mjs web-amc/tests/final-price-contract.test.mjs
          git commit -m 'Mantener refactor PDF con diff mínimo'
          git push origin HEAD:refactor-quote-pdf-generation-staging
